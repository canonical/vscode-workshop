name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: canonical/launch-workshop@v1
        with:
          workshop: ext
          cache: |
            node:npm-cache
      - run: workshop exec -- npm ci
      - run: workshop run -- test-ci
